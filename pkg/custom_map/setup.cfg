[develop]
script_dir=$base/lib/custom_map
[install]
install_scripts=$base/lib/custom_map

# RoboStack's launch_testing plugins were written against pytest 6: one still
# declares pytest_pycollect_makemodule(path, ...), the other registers a hook
# pytest no longer knows. Either one aborts collection with an INTERNALERROR
# before a single test runs, so `colcon test` reports the package as failing
# without ever reaching test/. This package has no launch tests, so neither
# plugin is loaded. Drop these once RoboStack ships launch_testing for pytest 8+.
[tool:pytest]
addopts = -p no:launch_testing -p no:launch_ros
